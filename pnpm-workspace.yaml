minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
# pnpm settings (pnpm ≥11 reads overrides from here, not package.json).
# js-yaml: markdownlint-cli pins ~5.2.1, which carries GHSA-pm4m-ph32-ghv5 (flow-collection DoS)
# and GHSA-r3ph-w7gj-g6xm (merge-key CPU use), both patched in 5.4.1. Drop this override once
# markdownlint-cli ships a bumped js-yaml.
overrides:
  'js-yaml@<5.4.1': '>=5.4.1'
  # brace-expansion <5.0.9 carries GHSA-rgw5-rvv9-x895 (DoS through
  # unbounded intermediate arrays). It reaches us only via eslint ->
  # minimatch. Drop once eslint ships a bumped minimatch.
  'brace-expansion@>=4.0.0 <5.0.9': '>=5.0.9'
  # smol-toml <=1.8.0 carries GHSA-7w5x-hrqm-74c2 (malformed-input DoS) and
  # GHSA-r4xh-jqrq-34v2 (quadratic-time parse), both patched in 1.8.1. It
  # reaches us only through markdownlint-cli, which pins ~1.7.0. Drop once
  # markdownlint-cli ships a bumped smol-toml.
  'smol-toml@<=1.8.0': '>=1.8.1'
  # katex <0.18.2 carries a prototype-pollution trust bypass (low). It reaches
  # us only through markdownlint -> micromark-extension-math. Drop once
  # markdownlint ships a bumped micromark-extension-math.
  'katex@>=0.11.0 <0.18.2': '>=0.18.2'
