olor:var(--ak-muted);white-space:normal}#ak-v5 .ak-warn{color:var(--ak-warn);background:var(--ak-warn-bg)}#ak-v5 .ak-good{color:var(--ak-accent);background:var(--ak-soft)}#ak-v5 .ak-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--ak-line)}#ak-v5 .ak-row:last-child{border-bottom:0}#ak-v5 .ak-row p{font-size:12px;color:var(--ak-muted);margin-top:3px}#ak-v5 .ak-action{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#ak-v5 .ak-hero{padding:23px;background:var(--ak-ink);color:var(--ak-bg);border-radius:var(--ak-radius);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;align-items:center}#ak-v5 .ak-hero p{font-size:13px;opacity:.82;margin-top:6px}#ak-v5 .ak-hero button{background:var(--ak-bg);color:var(--ak-ink);white-space:nowrap}#ak-v5 .ak-hero small{font-size:10px;letter-spacing:1.4px;text-transform:uppercase}#ak-v5 .ak-table-wrap{overflow-x:auto}#ak-v5 table{border-collapse:collapse;width:100%;font-size:12px}#ak-v5 th{text-align:left;color:var(--ak-muted);font-size:11px;font-weight:500;padding:10px 8px;border-bottom:1px solid var(--ak-line)}#ak-v5 td{padding:12px 8px;border-bottom:1px solid var(--ak-line);vertical-align:top}#ak-v5 td:first-child,#ak-v5 th:first-child{padding-left:0}#ak-v5 td small{display:block;color:var(--ak-muted);font-size:11px}#ak-v5 .ak-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#ak-v5 .ak-tags button{padding:4px 8px;font-size:11px}#ak-v5 .ak-tags button[aria-pressed=true]{background:var(--ak-accent);color:var(--ak-on);border-color:var(--ak-accent)}#ak-v5 .ak-form{display:grid;gap:14px}#ak-v5 .ak-form label.ak-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ak-ink)}#ak-v5 .ak-check input{margin:0;width:16px;height:16px;accent-color:var(--ak-accent)}#ak-v5 .ak-field-note{font-size:11px;color:var(--ak-muted);margin-top:4px}#ak-v5 .ak-code{background:var(--ak-soft);padding:12px;border-radius:9px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}#ak-v5 .ak-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:17px}#ak-v5 .ak-tabs button{padding:6px 10px;font-size:12px}#ak-v5 .ak-tabs button[aria-pressed=true]{background:var(--ak-accent);color:var(--ak-on)}#ak-v5 .ak-track{height:7px;background:var(--ak-soft);border-radius:5px;overflow:hidden;margin-top:8px}#ak-v5 .ak-fill{height:100%;background:var(--ak-accent)}#ak-v5 .ak-timeline{display:grid;gap:0;margin-top:14px}#ak-v5 .ak-event{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--ak-line)}#ak-v5 .ak-event time{font:11px ui-monospace,monospace;color:var(--ak-muted);padding-top:2px}#ak-v5 .ak-event p{font-size:12px;color:var(--ak-muted);margin-top:3px}#ak-v5 .ak-banner{padding:12px 15px;background:var(--ak-soft);border-radius:9px;font-size:12px;margin:14px 0;color:var(--ak-muted)}#ak-v5 .ak-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;margin-top:24px;border-top:1px solid var(--ak-line);font-size:10px;color:var(--ak-muted)}#ak-v5 .ak-status{font-size:12px;color:var(--ak-accent);min-height:18px;margin-top:12px}#ak-v5 .ak-review{background:var(--ak-surface);border:2px solid var(--ak-accent);border-radius:var(--ak-radius);padding:22px;margin-top:20px}#ak-v5 .ak-review h2{margin-bottom:8px}#ak-v5 .ak-review p{color:var(--ak-muted);font-size:12px;margin:7px 0}#ak-v5 .ak-review[hidden]{display:none}#ak-v5 .ak-progress-steps{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}#ak-v5 .ak-progress-steps span{font-size:11px;padding:5px 9px;background:var(--ak-soft);border-radius:7px}#ak-v5 .ak-split{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}#ak-v5 .ak-subtle-button{border:0;background:transparent;padding:3px 0;color:var(--ak-accent);font-size:12px}#ak-v5 .ak-footnote{font-size:11px;color:var(--ak-muted);margin-top:10px}#ak-v5 .ak-item-title{display:flex;align-items:center;gap:8px}#ak-v5 .ak-dot{width:6px;height:6px;border-radius:50%;background:var(--ak-accent);display:inline-block}#ak-v5 [data-density=compact] .ak-row{padding:8px 0}
@media(max-width:760px){#ak-v5 .ak-frame{grid-template-columns:1fr}#ak-v5 .ak-side{padding:10px 14px;border-right:0;border-bottom:1px solid var(--ak-line)}#ak-v5 .ak-side nav{display:flex;flex-wrap:wrap;gap:3px}#ak-v5 .ak-side nav button{padding:8px;font-size:12px}#ak-v5 .ak-side-note{display:none}#ak-v5 .ak-main{padding:18px}#ak-v5 .ak-split{grid-template-columns:1fr}#ak-v5 .ak-grid3{grid-template-columns:1fr 1fr}#ak-v5 h1{font-size:28px}}

<header class="ak-top"><div class="ak-brand"><span class="ak-mark">ak</span> agentic kit <span class="ak-pill">v5</span></div><small class="ak-muted">PRODUCT CONCEPT · ILLUSTRATIVE DATA</small></header>
<div class="ak-frame"><aside class="ak-side"><nav aria-label="Primary navigation"></nav><div class="ak-side-note"><span class="ak-dot"></span> Local workspace<br>Team sync is optional<br><br>One plan.<br>UI or CLI.<br>Same result.</div></aside><main class="ak-main"><div class="ak-context"><label>WORKSPACE<select id="ak-workspace" aria-label="Workspace"><option>All work</option><option>Acme</option><option>Internal</option></select></label><label>YOUR LENS<select id="ak-persona" aria-label="Your lens"><option>Builder</option><option>Operator</option><option>Team lead</option><option>Finance</option><option>Assurance</option></select></label></div><div id="ak-content"></div><section class="ak-review" id="ak-review" aria-label="Review change" hidden></section><div class="ak-status" id="ak-status" role="status" aria-live="polite"></div><footer class="ak-footer"><span>Concept only · actions simulate local changes</span><span>Metrics: sample set · USD · Sep 19–25, 2026</span></footer></main></div>
<script>
(()=>{
const root=document.getElementById('ak-v5'), content=root.querySelector('#ak-content'), review=root.querySelector('#ak-review'), status=root.querySelector('#ak-status');
const state={page:'Today',persona:'Builder',workspace:'All work',labels:[],match:'any',component:'Ruflo',scope:'Project',mode:'Guided',tab:'Settings',selectedSession:1,policy:null,receipts:[],configDrafts:{},density:'comfortable',accent:'forest'};
const nav=[['Today','sun'],['Work','layers'],['Sessions','activity'],['Stack','sliders-horizontal'],['Updates','refresh-cw'],['Fleet','network'],['Value','chart-no-axes-combined']];
const projects=[{id:'p1',name:'Acme / Checkout',labels:['Acme','Release'],owner:'Maya',purpose:'Fewer abandoned checkouts'},{id:'p2',name:'Acme / Platform',labels:['Acme','Platform'],owner:'Sam',purpose:'A dependable delivery foundation'},{id:'p3',name:'Agentic Kit',labels:['Internal','Platform'],owner:'Chris',purpose:'One place to run your agent stack'},{id:'p4',name:'Evaluation lab',labels:['Internal','Research'],owner:'Alex',purpose:'Compare hosts on the same work'}];
const sessions=[{id:1,project:'p1',name:'Repair checkout retries',host:'Codex',person:'Maya',tokens:820000,equiv:8.40,actual:null,labels:['Release'],status:'Needs review'},{id:2,project:'p1',name:'Validate payment flow',host:'Claude',person:'Maya',tokens:460000,equiv:5.60,actual:null,labels:['Quality'],status:'Complete'},{id:3,project:'p2',name:'Trace queue latency',host:'OpenCode',person:'Sam',tokens:340000,equiv:2.80,actual:2.36,labels:['Incident'],status:'Running'},{id:4,project:'p3',name:'Unify configuration plans',host:'Hermes',person:'Chris',tokens:610000,equiv:4.30,actual:3.10,labels:['Design'],status:'Complete'},{id:5,project:'p4',name:'Compare migration plans',host:'Gemini CLI',person:'Alex',tokens:240000,equiv:1.60,actual:null,labels:['Research'],status:'Partial evidence'},{id:6,project:'p4',name:'Evaluate Grok Build adapter',host:'Grok Build',person:'Alex',tokens:190000,equiv:1.35,actual:1.14,labels:['Research'],status:'Complete'},{id:7,project:'p2',name:'Document deployment recovery',host:'Claude',person:'Sam',tokens:310000,equiv:3.25,actual:null,labels:['Quality'],status:'Complete'},{id:8,project:'p3',name:'Verify profile isolation',host:'Codex',person:'Chris',tokens:420000,equiv:3.90,actual:null,labels:['Quality'],status:'Complete'}];
const allLabels=['Acme','Internal','Platform','Release','Research','Quality','Incident','Design'];
const hosts=['Claude','Codex','Hermes','OpenCode','Gemini CLI','Grok Build'];
const components={Ruflo:{a:'Coordination strategy',opts:['Specialized','Balanced','Adaptive'],b:'Worker concurrency',val:4,help:'Project override · default 2 · supported by selected adapter'},'Agentic QE':{a:'Quality gate profile',opts:['Focused','Release','Exploratory'],b:'Concurrent checks',val:3,help:'Project override · inherited from team quality policy'},AgentDB:{a:'Memory namespace',opts:['Project shared','Host isolated','Experiment'],b:'Recall result limit',val:10,help:'One canonical project store · host-specific context remains separate'},'RuvNet Brain':{a:'Knowledge refresh',opts:['Reviewed bundle','Manual only','Nightly approved'],b:'Retention snapshots',val:3,help:'Preserve private overlays · bundle and plugin versions tracked separately'},RuVector:{a:'Vector backend',opts:['Auto detect','Native','WASM'],b:'Search result limit',val:8,help:'Capabilities probed before settings are offered'},'Host settings':{a:'Default host',opts:hosts,b:'Execution timeout (minutes)',val:30,help:'Adapter validates host version and supported configuration scope'}};
const money=n=>'$'+n.toFixed(2), number=n=>n>=1000000?(n/1000000).toFixed(2)+'M':Math.round(n/1000)+'K', esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const project=s=>projects.find(p=>p.id===s.project), labels=s=>[...new Set([...project(s).labels,...s.labels])];
function selected(){return sessions.filter(s=>(state.workspace==='All work'||labels(s).includes(state.workspace))&&(!state.labels.length||(state.match==='all'?state.labels.every(l=>labels(s).includes(l)):state.labels.some(l=>labels(s).includes(l)))))}
function totals(){let ss=selected();return{count:ss.length,tokens:ss.reduce((n,s)=>n+s.tokens,0),equiv:ss.reduce((n,s)=>n+s.equiv,0),actual:ss.reduce((n,s)=>n+(s.actual??0),0),known:ss.filter(s=>s.actual!==null).length}}
function button(text,action,primary=false){return '<button type="button" class="cursor-interaction '+(primary?'ak-primary':'')+'" data-action="'+action+'">'+text+'</button>'}
function heading(kicker,title,sub,action=''){return '<div class="ak-heading"><div><div class="ak-eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function stat(label,val,note){return '<div class="ak-stat"><small>'+label+'</small><span class="ak-number">'+val+'</span><small>'+note+'</small></div>'}
function go(page){state.page=page;review.hidden=true;status.textContent='';render()}
function home(){const t=totals();const lenses={Builder:['Your work, in focus.','Pick up a session, clear a blocker, keep moving.','Checkout is ready for your review.','Codex completed the patch. Two checks passed; one human decision remains.','Review session','Sessions'],Operator:['A calmer operating day.','See the changes that need you. Keep the rest predictable.','Two updates can wait for the quiet window.','One private knowledge overlay is protected. Review the update plan before applying.','Review updates','Updates'],'Team lead':['See the work moving.','Follow work across people, machines, and hosts.','Checkout is waiting for review.','One work item is blocked; three hosts are progressing on related work.','Open work','Work'],Finance:['Know what the numbers mean.','Trace cost to clients, projects, and the evidence underneath.','Five sessions have no source-reported cost.','API-equivalent estimates are available. Subscription allocation is a separate policy.','Explore value','Value'],Assurance:['Trust, with a paper trail.','Understand who changed what, where, and under which policy.','A configuration override needs review.','The lab differs from the shared baseline. Production settings remain locked.','Inspect stack','Stack']};let h=lenses[state.persona],focus=selected()[0];if(state.persona==='Finance')h[2]=(t.count-t.known)+' sessions have no source-reported cost.';if(state.workspace!=='All work'&&(state.persona==='Builder'||state.persona==='Team lead')){h[2]=focus?focus.name:'No work in this view yet.';h[3]=focus?project(focus).name+' · '+focus.status:'Change the workspace to explore other work.'}return heading('Good morning · '+state.persona,h[0],h[1])+`<div class="ak-hero"><div><small>Next useful action</small><h2>${h[2]}</h2><p>${h[3]}</p></div>${button(h[4]+' →','go:'+h[5])}</div><div class="ak-stats">${stat('Sessions in this view',t.count,'Across '+new Set(selected().map(s=>s.host)).size+' hosts')}${stat('Source-reported cost',money(t.actual),t.known+' of '+t.count+' sessions have cost evidence')}${stat('API-equivalent estimate',money(t.equiv),'List-rate comparison · not your bill')}</div><div class="ak-grid2"><section class="ak-panel"><div class="ak-section-head"><h2>Needs your attention</h2><span class="ak-pill">2 decisions</span></div><div class="ak-row"><div><h3>${focus?focus.name:'No selected session'}</h3><p>${focus?esc(project(focus).name+' · '+focus.host+' · '+focus.person):'Choose another scope'}</p></div>${button('Review','go:Sessions')}</div><div class="ak-row"><div><h3>Keep a private overlay</h3><p>Brain refresh · preservation required</p></div>${button('View plan','go:Updates')}</div><div class="ak-row"><div><h3>Gemini evidence is incomplete</h3><p>Usage captured; nested calls unavailable</p></div><span class="ak-pill">Visibility gap</span></div></section><section class="ak-panel"><h2>Recent work</h2>${selected().slice(0,3).map(s=>`<div class="ak-row"><div><h3>${s.name}</h3><p>${project(s).name} · ${s.host}</p></div><span class="ak-pill">${s.status}</span></div>`).join('')}${button('View all work →','go:Work')}</section></div>`}
function work(){return heading('Work','Organize around intent.','Projects can belong to several labels. Sessions inherit them and can carry their own.')+`<div class="ak-grid2">${projects.filter(p=>state.workspace==='All work'||p.labels.includes(state.workspace)).map(p=>`<section class="ak-panel"><div class="ak-section-head"><h2>${p.name}</h2><span class="ak-pill">${p.owner}</span></div><p class="ak-muted">${p.purpose}</p><div class="ak-tags">${allLabels.slice(0,5).map(l=>`<button class="cursor-interaction" type="button" aria-label="${esc(p.name)} label ${l}" aria-pressed="${p.labels.includes(l)}" data-project="${p.id}" data-label="${l}">${l}</button>`).join('')}</div><div class="ak-row"><small>${selected().filter(s=>s.project===p.id).length} sessions</small><small>${money(selected().filter(s=>s.project===p.id).reduce((a,s)=>a+s.equiv,0))} API equivalent</small></div></section>`).join('')}</div><div class="ak-banner">Labels overlap. A selected session is counted once in totals. Client allocation uses a separate billing policy.</div><div class="ak-section-head"><h2>Saved views</h2>${button('Explore label totals →','go:Value')}</div><div class="ak-row"><div><h3>Acme delivery</h3><p>Projects + sessions labeled Acme · saved query</p></div>${button('Open','workspace:Acme')}</div><div class="ak-row"><div><h3>Internal platform work</h3><p>Internal AND Platform · shared with team</p></div>${button('Open','saved:platform')}</div>`}
function sessionView(){let population=selected();if(!population.length)return heading('Sessions','No sessions in this view.','Change the workspace or label selection to see more work.');let s=population.find(x=>x.id===state.selectedSession)||population[0];state.selectedSession=s.id;return heading('Sessions','Follow the actual work.','A readable timeline across hosts, with missing evidence shown in place.')+`<div class="ak-split"><section class="ak-panel"><h2>Session stream</h2>${selected().map(x=>`<div class="ak-row"><div><button class="ak-subtle-button cursor-interaction" data-action="session:${x.id}">${x.name}</button><p>${x.host} · ${x.person}</p></div><span class="ak-pill ${x.status==='Needs review'?'ak-warn':''}">${x.status}</span></div>`).join('')}</section><section class="ak-panel"><div class="ak-section-head"><h2>${s.name}</h2><span class="ak-pill">${s.host}</span></div><p class="ak-muted">${project(s).name} · ${s.person}</p><div class="ak-tags">${labels(s).map(l=>`<span class="ak-pill">${l}</span>`).join('')}</div><div class="ak-form ak-section"><label>Session label<select id="ak-session-label">${allLabels.map(l=>'<option>'+l+'</option>').join('')}</select></label>${button('Add session label','add-session-label')}</div><div class="ak-timeline"><div class="ak-event"><time>09:14</time><div><h3>Intent captured</h3><p>Restore retries without duplicate writes.</p></div></div><div class="ak-event"><time>09:17</time><div><h3>Implementation changed</h3><p>Tool event · repository evidence available</p></div></div><div class="ak-event"><time>09:21</time><div><h3>Checks completed</h3><p>Two results linked to this work item</p></div></div><div class="ak-event"><time>09:23</time><div><h3>Evidence gap</h3><p>Nested provider calls are not captured by this source.</p></div></div><div class="ak-event"><time>09:25</time><div><h3>Checkpoint available</h3><p>Goal, decisions, source revision, and unresolved work</p></div></div></div>${button('Preview host handoff','handoff',true)}<p class="ak-footnote">Illustrative timeline. Host handoff carries a checkpoint; authentication stays with each host.</p></section></div>`}
function stack(){let c=components[state.component];return heading('Stack','Tune it once. See every effect.','One configuration contract, rendered in the UI and available at the CLI.')+`<div class="ak-tabs">${['Settings','Hosts','Coverage'].map(t=>`<button type="button" class="cursor-interaction" data-action="stacktab:${t}" aria-pressed="${state.tab===t}">${t}</button>`).join('')}</div>`+(state.tab==='Hosts'?`<div class="ak-grid2">${hosts.map((h,i)=>`<section class="ak-panel"><div class="ak-section-head"><h2>${h}</h2><span class="ak-pill ${i>3?'ak-warn':'ak-good'}">${i>3?'Candidate adapter':'Managed'}</span></div><div class="ak-row"><span>Environment</span><span>${i%2?'Lab':'Work'}</span></div><div class="ak-row"><span>Execution</span><span>Structured events</span></div><div class="ak-row"><span>Nested-call visibility</span><span>${i%2?'Partial':'Source dependent'}</span></div><p class="ak-footnote">Independent installation identity · credentials stay local</p></section>`).join('')}</div>`:state.tab==='Coverage'?`<section class="ak-panel"><h2>Every setting has an honest state</h2><div class="ak-row"><span>Managed and editable</span><span class="ak-pill ak-good">UI + CLI</span></div><div class="ak-row"><span>Inherited from team</span><span class="ak-pill">View source · local override if allowed</span></div><div class="ak-row"><span>Host-owned credential</span><span class="ak-pill">Authenticate in host</span></div><div class="ak-row"><span>Setting unknown to this adapter version</span><span class="ak-pill ak-warn">Preserved · no blind write</span></div><div class="ak-row"><span>Policy locked</span><span class="ak-pill">Request a change</span></div></section>`:`<div class="ak-grid2"><section class="ak-panel"><div class="ak-form"><label>Component<select id="ak-component">${Object.keys(components).map(n=>`<option ${n===state.component?'selected':''}>${n}</option>`).join('')}</select></label><div class="ak-grid2"><label>Write scope<select id="ak-scope">${['Project','Environment','User'].map(n=>`<option ${n===state.scope?'selected':''}>${n}</option>`).join('')}</select></label><label>Detail level<select id="ak-mode"><option ${state.mode==='Guided'?'selected':''}>Guided</option><option ${state.mode==='Advanced'?'selected':''}>Advanced</option></select></label></div><label>${c.a}<select id="ak-setting-a">${c.opts.map(n=>'<option>'+n+'</option>').join('')}</select></label><label>${c.b}<input type="number" id="ak-setting-b" min="1" max="32" value="${c.val}"></label><div class="ak-field-note">${c.help}</div>${state.mode==='Advanced'?'<div class="ak-banner">Native extensions stay namespaced. Unknown fields are preserved. A host policy can lock an otherwise writable value.</div>':''}${button('Preview change →','config-preview',true)}</div></section><section class="ak-panel"><div class="ak-section-head"><h2>Effective configuration</h2><span class="ak-pill">Explainable</span></div><div class="ak-row"><span>Host policy</span><span class="ak-pill">Always enforced</span></div><div class="ak-row"><span>Team baseline</span><span>Inherited</span></div><div class="ak-row"><span>User / environment</span><span>Work</span></div><div class="ak-row"><span>Project override</span><span class="ak-pill ak-good">${state.scope==='Project'?'Editing here':'No local change'}</span></div><div class="ak-row"><span>Secrets</span><span>References only</span></div><div class="ak-section"><h3>Same change at the CLI</h3><div class="ak-code" id="ak-config-cli">${configCLI(false)}</div><p class="ak-footnote">Proposed v5 command. Preview resolves adapter scope rules and native precedence before writing.</p></div></section></div>`)}
function configCLI(useCurrent=true){const keys={Ruflo:['strategy','maxConcurrent'],'Agentic QE':['gateProfile','maxConcurrent'],AgentDB:['namespace','recallLimit'],'RuvNet Brain':['refreshPolicy','retainedSnapshots'],RuVector:['backend','resultLimit'],'Host settings':['defaultHost','timeoutMinutes']};let c=components[state.component],k=keys[state.component],a=useCurrent?(root.querySelector('#ak-setting-a')?.value||c.opts[0]):c.opts[0],b=useCurrent?(root.querySelector('#ak-setting-b')?.value||c.val):c.val;return 'ak config plan --component '+state.component.toLowerCase().replaceAll(' ','-')+' --scope '+state.scope.toLowerCase()+' --set '+k[0]+'=\"'+a+'\" --set '+k[1]+'='+b}
function updates(){return heading('Updates','Current, on your terms.','One component or the whole estate. Run now or use a quiet maintenance window.')+`<div class="ak-grid2"><section class="ak-panel"><div class="ak-section-head"><h2>On demand</h2><span class="ak-pill">Plan first</span></div><div class="ak-form"><label>Target<select id="ak-update-target"><option>Entire estate</option><option>Workspace: Acme</option><option>Host: Codex</option><option>Component: RuvNet Brain</option></select></label><label>Release policy<select id="ak-update-channel"><option>Reviewed compatible set</option><option>Latest stable</option><option>Preview · lab only</option></select></label><label class="ak-check"><input id="ak-idle" type="checkbox" checked>Wait for active sessions to finish</label>${button('Preview update plan →','update-preview',true)}</div><div class="ak-banner">2 available · 1 held for private data preservation · 1 restart required</div><h3>Change ledger</h3>${state.receipts.length?state.receipts.map(r=>'<div class="ak-row"><span>'+esc(r)+'</span><span class="ak-pill ak-good">Verified · demo</span></div>').join(''):'<p class="ak-footnote">Every completed change leaves its plan, checks, and recovery options here.</p>'}</section><section class="ak-panel"><div class="ak-section-head"><h2>Scheduled care</h2><span class="ak-pill">${state.policy?'Enabled in demo':'Not enabled'}</span></div>${state.policy?'<div class="ak-banner">Saved: '+esc(state.policy.frequency+' '+state.policy.time+' '+state.policy.zone)+' · '+esc(state.policy.target)+' · '+esc(state.policy.action)+'</div>':''}<div class="ak-form"><label>Target<select id="ak-schedule-target"><option>Entire estate</option><option>Workspace: Acme</option><option>Component: RuvNet Brain</option></select></label><label>When<select id="ak-frequency"><option>Every Sunday</option><option>Every day</option><option>First day of month</option></select></label><div class="ak-grid2"><label>Start time<input id="ak-time" type="time" value="02:00"></label><label>Timezone<select id="ak-zone"><option>America/Los_Angeles</option><option>Europe/London</option><option>UTC</option></select></label></div><label>Allowed action<select id="ak-schedule-action"><option>Check and notify</option><option>Apply reviewed updates while idle</option></select></label>${button('Review schedule','schedule-preview')}<p class="ak-footnote">Device asleep? Catch up once, only inside the next allowed window. New permissions or migrations require a fresh decision.</p></div></section></div>`}
function fleet(){return heading('Fleet','A team you can see.','People, machines, environments, and sessions are distinct. Every observation has an age.')+`<div class="ak-stats">${stat('Reporting machines','3 / 4','One device is offline')}${stat('Active environments','5','Work and lab are separate')}${stat('Data shared','Aggregates','Transcripts remain on each device')}</div><section class="ak-panel"><div class="ak-section-head"><h2>Environment health</h2>${button('Preview enrollment','enroll')}</div><div class="ak-table-wrap"><table><thead><tr><th>Machine / environment</th><th>Owner</th><th>Evidence</th><th>Policy</th></tr></thead><tbody><tr><td>Studio / Work<small>Claude · Codex · Grok Build</small></td><td>Chris</td><td><span class="ak-pill ak-good">Fresh · 18s ago</span></td><td>Manual approval</td></tr><tr><td>Studio / Lab<small>Hermes · Gemini CLI</small></td><td>Chris</td><td><span class="ak-pill ak-warn">Gemini calls partial</span></td><td>Preview allowed</td></tr><tr><td>Maya / Work<small>Claude · Codex</small></td><td>Maya</td><td><span class="ak-pill ak-good">Fresh · 40s ago</span></td><td>Sunday reviewed set</td></tr><tr><td>Build runner<small>OpenCode</small></td><td>Platform</td><td><span class="ak-pill ak-good">Fresh · 8s ago</span></td><td>Canary first</td></tr><tr><td>Sam / Work<small>OpenCode · Claude</small></td><td>Sam</td><td><span class="ak-pill ak-warn">Offline · 3h ago</span></td><td>Updates paused</td></tr></tbody></table></div></section><div class="ak-grid2 ak-section"><section class="ak-panel"><h2>Consent &amp; access</h2><div class="ak-row"><span>Team lens</span><span>Presentation preference</span></div><div class="ak-row"><span>Operator permission</span><span>Apply scoped plans</span></div><div class="ak-row"><span>Finance permission</span><span>Aggregates and allocation</span></div></section><section class="ak-panel"><h2>Share only what helps</h2><div class="ak-row"><span>Source transcripts</span><span>Local only</span></div><div class="ak-row"><span>Person attribution</span><span>Explicit enrollment</span></div><div class="ak-row"><span>Remote changes</span><span>Separate grant</span></div></section></div>`}
function value(){let t=totals(),ss=selected();return heading('Value','Every dollar has a story.','Explore overlapping labels without counting a session twice.')+`<section class="ak-panel"><div class="ak-section-head"><h2>Slice the work</h2><label>Match<select id="ak-match"><option value="any" ${state.match==='any'?'selected':''}>Any selected label</option><option value="all" ${state.match==='all'?'selected':''}>All selected labels</option></select></label></div><div class="ak-tags">${allLabels.map(l=>`<button type="button" class="cursor-interaction" aria-pressed="${state.labels.includes(l)}" data-filter="${l}">${l}</button>`).join('')}</div><p class="ak-footnote">${state.labels.length?state.labels.join(state.match==='all'?' ∩ ':' ∪ '):'All labels'} · ${t.count} unique sessions</p></section><div class="ak-stats">${stat('Tokens observed',number(t.tokens),'Input + output + reported cache categories')}${stat('Source-reported cost',money(t.actual),t.known+'/'+t.count+' sessions with cost evidence')}${stat('API-equivalent estimate',money(t.equiv),'Comparison basis · sample rate card')}</div><div class="ak-grid2"><section class="ak-panel"><h2>By project</h2>${projects.map(p=>{const sum=ss.filter(s=>s.project===p.id).reduce((n,s)=>n+s.equiv,0);return sum?`<div class="ak-row"><div style="width:100%"><div class="ak-section-head" style="margin:0"><span>${p.name}</span><span>${money(sum)}</span></div><div class="ak-track"><div class="ak-fill" style="width:${t.equiv?sum/t.equiv*100:0}%"></div></div></div></div>`:''}).join('')}<p class="ak-footnote">API-equivalent estimate. Project rows partition this sample.</p></section><section class="ak-panel"><h2>Billing basis</h2><div class="ak-row"><span>Source-reported cost</span><span>${money(t.actual)}</span></div><div class="ak-row"><span>Unpriced / subscription sessions</span><span>${t.count-t.known}</span></div><div class="ak-row"><span>Subscription allocation</span><span class="ak-pill">Not configured</span></div><div class="ak-row"><span>Client invoice amount</span><span class="ak-pill">Separate agreement</span></div>${button('Review allocation policy','allocation')}<p class="ak-footnote">A label is a useful lens. It does not authorize a bill or choose a payer.</p></section></div><section class="ak-section"><div class="ak-section-head"><h2>Delivery evidence</h2><span class="ak-pill">Proposed integration</span></div><div class="ak-banner">Link reviewed work items to pull requests, checks, and releases. Cost per accepted outcome becomes available only when that denominator is complete.</div></section>`}
function render(){root.querySelector('nav').innerHTML=nav.map(([n,i])=>`<button type="button" class="cursor-interaction" data-action="go:${n}" ${state.page===n?'aria-current="page"':''}><i data-lucide="${i}" aria-hidden="true"></i>${n}</button>`).join('');content.innerHTML=(state.labels.length?'<div class="ak-banner">Session filter: '+state.labels.join(state.match==='all'?' ∩ ':' ∪ ')+' · '+button('Clear labels','clear-labels')+'</div>':'')+({Today:home,Work:work,Sessions:sessionView,Stack:stack,Updates:updates,Fleet:fleet,Value:value}[state.page])();root.querySelector('#ak-workspace').value=state.workspace;root.querySelector('#ak-persona').value=state.persona;root.querySelector('.ak-main').dataset.density=state.density;if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}})}
function showReview(title,body,cli,action,label='Apply in demo'){review.innerHTML='<div class="ak-eyebrow">Review · simulated action</div><h2>'+title+'</h2>'+body+(cli?'<div class="ak-code">'+esc(cli)+'</div><p class="ak-footnote">Proposed v5 CLI · no command is executed</p>':'')+'<div class="ak-action ak-section">'+button(label,action,true)+button('Close preview','close-review')+'</div>';review.hidden=false;review.scrollIntoView({block:'nearest',behavior:'instant'})}
function confirm(message){review.hidden=true;state.receipts.unshift(message);render();status.textContent=message+' — simulated only. No system changes were made.'}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.project){let p=projects.find(p=>p.id===b.dataset.project),l=b.dataset.label;p.labels=p.labels.includes(l)?p.labels.filter(x=>x!==l):[...p.labels,l];render();status.textContent='Project labels updated in demo. Session totals use inherited labels.';return}if(b.dataset.filter){let l=b.dataset.filter;state.labels=state.labels.includes(l)?state.labels.filter(x=>x!==l):[...state.labels,l];render();return}let a=b.dataset.action||'';if(a==='clear-labels'){state.labels=[];render();return}if(a.startsWith('go:'))return go(a.slice(3));if(a.startsWith('workspace:')){state.workspace=a.slice(10);return go('Value')}if(a==='saved:platform'){state.labels=['Internal','Platform'];state.match='all';return go('Value')}if(a.startsWith('stacktab:')){state.tab=a.slice(9);return render()}if(a.startsWith('session:')){state.selectedSession=Number(a.slice(8));return render()}if(a==='close-review'){review.hidden=true;return}if(a==='add-session-label'){let s=sessions.find(s=>s.id===state.selectedSession),l=root.querySelector('#ak-session-label').value;if(!s.labels.includes(l))s.labels.push(l);render();status.textContent='Session label added in demo. Value totals recalculate from unique session IDs.';return}
if(a==='config-preview'){let val=Number(root.querySelector('#ak-setting-b').value);if(!Number.isInteger(val)||val<1||val>32){status.textContent='Enter a whole number between 1 and 32.';return}let opt=root.querySelector('#ak-setting-a').value;state.configPreview={component:state.component,scope:state.scope,value:val,option:opt};showReview('Change '+state.component+' settings','<p>'+esc(state.scope)+' scope · '+esc(opt)+' · '+val+'</p><div class="ak-progress-steps"><span>1 · Validate</span><span>2 · Compare</span><span>3 · Apply</span><span>4 · Verify</span></div><p>Only owned settings change. Unknown values are preserved. A changed source file invalidates this plan.</p><p>Recovery: restore the prior owned configuration. Active sessions adopt settings when the host supports reload.</p>',configCLI(),'config-apply');return}if(a==='config-apply'){let c=components[state.configPreview.component];c.val=state.configPreview.value;let chosen=state.configPreview.option;c.opts=[chosen,...c.opts.filter(x=>x!==chosen)];return confirm(state.component+' configuration saved')}
if(a==='update-preview'){let target=root.querySelector('#ak-update-target').value,channel=root.querySelector('#ak-update-channel').value,idle=root.querySelector('#ak-idle').checked;state.updateTarget=target;let brainOnly=target==='Component: RuvNet Brain',codexOnly=target==='Host: Codex',body='<p>Selected target: '+esc(target)+'. Only its applicable dependency closure is included.</p><p>'+esc(channel)+' · '+(idle?'Wait until idle':'Active-session handling requires review')+'</p>';if(!brainOnly)body+='<div class="ak-row"><span>'+ (codexOnly?'Codex owned installation':'Compatible owned packages')+'</span><span class="ak-pill ak-good">Ready</span></div>';if(!codexOnly)body+='<div class="ak-row"><span>RuvNet Brain private overlay</span><span class="ak-pill ak-warn">Held · preserving updater required</span></div>';if(!brainOnly)body+='<div class="ak-row"><span>Running host sessions</span><span class="ak-pill">Restart required</span></div>';body+='<p>Plan binds target versions and current state. Dependency changes cause a new plan. Package rollback is offered only where the installer supports it.</p>';showReview('Update '+target.toLowerCase(),body,'ak update plan --target "'+target+'" --policy "'+channel+'"'+(idle?' --when-idle':''),brainOnly?'close-review':'update-apply',brainOnly?'Keep held':'Apply ready changes in demo');return}if(a==='update-apply')return confirm(state.updateTarget==='Host: Codex'?'Codex updated; restart required':'Ready updates applied; held resources unchanged');
if(a==='schedule-preview'){state.draftPolicy={target:root.querySelector('#ak-schedule-target').value,frequency:root.querySelector('#ak-frequency').value,time:root.querySelector('#ak-time').value,zone:root.querySelector('#ak-zone').value,action:root.querySelector('#ak-schedule-action').value};let p=state.draftPolicy;showReview('Set a maintenance window','<p>'+esc(p.target)+' · '+esc(p.frequency)+' at '+esc(p.time)+' '+esc(p.zone)+'</p><p>'+esc(p.action)+'. Skip while busy; one catch-up within the next window. Notify only on action needed, completion, or failure.</p><p>New target permissions, dependency migrations, or a changed policy require review.</p>','ak schedules plan --target "'+p.target+'" --when "'+p.frequency+' '+p.time+'" --timezone '+p.zone+' --mode "'+p.action+'"','schedule-apply','Save schedule in demo');return}if(a==='schedule-apply'){state.policy=state.draftPolicy;return confirm('Maintenance schedule saved')}
if(a==='handoff'){showReview('Continue with another host','<p>Package the goal, source revision, decisions, worktree identity, test evidence, and unresolved items. Verify the receiving host can read the same project memory.</p><p>Raw conversation and credentials are excluded by default.</p>','ak sessions handoff --session demo-'+state.selectedSession+' --to claude --preview','handoff-apply','Save checkpoint in demo');return}if(a==='handoff-apply')return confirm('Portable checkpoint prepared');
if(a==='enroll'){showReview('Connect one machine','<p>Pair a device using a short-lived enrollment code. Share aggregate metrics and health. Choose team identity explicitly.</p><p>Remote execution needs a separate scoped grant; viewing a machine does not grant control.</p>','ak fleet enroll --team example --share aggregates','enroll-apply','Pair demo machine');return}if(a==='enroll-apply')return confirm('Demo enrollment receipt created');
if(a==='allocation'){showReview('Allocate independently of labels','<p>Choose one primary client per session, or explicit split weights totaling 100%. Overlapping display labels remain useful for exploration.</p><p>Freeze allocation rules and rate-card version when closing a billing period. Unknown source cost remains unknown.</p>','ak allocation plan --period 2026-09 --basis observed-api','allocation-apply','Save draft policy');return}if(a==='allocation-apply')return confirm('Draft allocation policy saved');
});
root.addEventListener('change',e=>{let id=e.target.id;if(id==='ak-workspace')state.workspace=e.target.value;else if(id==='ak-persona')state.persona=e.target.value;else if(id==='ak-match')state.match=e.target.value;else if(id==='ak-component')state.component=e.target.value;else if(id==='ak-scope')state.scope=e.target.value;else if(id==='ak-mode')state.mode=e.target.value;else if(id==='ak-setting-a'){review.hidden=true;root.querySelector('#ak-config-cli').textContent=configCLI();return}else return;review.hidden=true;render()});
root.addEventListener('input',e=>{if(e.target.id==='ak-setting-b'&&root.querySelector('#ak-config-cli')){review.hidden=true;root.querySelector('#ak-config-cli').textContent=configCLI()}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--ak-radius',state.density==='compact'?'8px':'14px');root.style.setProperty('--ak-accent',state.accent==='blue'?'light-dark(#2456a6,#a8c7ff)':'light-dark(#075f51,#9be3c7)');render()}});tweak.addSelect(state,'density',{label:'Density',options:['comfortable','compact']});tweak.addSelect(state,'accent',{label:'Accent direction',options:[{label:'Forest','value':'forest'},{label:'Cobalt','value':'blue'}]});tweak.addSelect(state,'persona',{label:'Default lens',options:['Builder','Operator','Team lead','Finance','Assurance']});}
})();
