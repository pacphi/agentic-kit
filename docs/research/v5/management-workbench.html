function stats(items){return '<div class="ac-stats">'+items.map(([l,v,n])=>'<div class="ac-stat"><small>'+esc(l)+'</small><span>'+esc(v)+'</span><small>'+esc(n)+'</small></div>').join('')+'</div>'}
function bars(items){const max=Math.max(...items.map(x=>x[1]),1);return items.map(([n,v])=>'<div class="ac-bar-row"><div class="ac-bar-label"><span>'+esc(n)+'</span><span>'+esc(v)+'</span></div><div class="ac-track"><div class="ac-fill" style="width:'+v/max*100+'%"></div></div></div>').join('')}
function sharedList(home,limit=8){const rows=PANELS.filter(p=>p.proposedHome===home);return '<div class="ac-card-head"><h2>Shared panel library</h2>'+btn('Map all '+rows.length+' panels','map-home:'+home)+'</div>'+rows.slice(0,limit).map(p=>'<div class="ac-row"><div><h3>'+esc(p.title)+'</h3><p>'+esc(p.area+' › '+p.view+' · '+p.presentation)+'</p></div>'+btn('Open','panel:'+p.id)+'</div>').join('');}
function attention(limit=3){return activeFindings().slice(0,limit).map(f=>'<div class="ac-attention"><div class="ac-card-head" style="margin-bottom:4px"><h3>'+esc(f.title)+'</h3>'+pill(f.severity,f.fixable?'ac-ok':'ac-warn')+'</div><p>'+esc(f.why[state.focus])+'</p><div class="ac-actions">'+btn(f.fixable?'Inspect remedy':'Inspect evidence','finding:'+f.id)+note('Same finding · priority for '+state.focus)+'</div></div>').join('')||'<div class="ac-banner">No matching attention items. Source freshness remains visible below.</div>';}
function overview(){return heading('Know what needs you.','Shared health, work and evidence. Your attention focus ranks the same findings without changing their severity.',btn('Review drift','go:Manage:Drift'))+attention(3)+stats([['Reporting',targets().filter(m=>m.online).length+'/'+targets().length,'Enrolled scope · sample data'],['Under management',components.filter(managed).length,'Settings and lifecycle ownership explicit'],['Schedules',state.scheduleApplied?'Enabled':'Off','Opt-in · on-demand stays available']])+'<div class="ac-grid">'+card('All subsystems',components.filter(c=>c.installed).slice(0,6).map(c=>row(c.name,btn(managed(c)?'Managed':'Observed','component:'+c.id))).join(''),'Builder · Operator · Assurance')+card('Updates and changes',row('Candidates',components.filter(c=>c.update&&!updated(c)).length+' components')+row('Private data hold',pill('Brain overlay preserved','ac-warn'))+btn('Review eligibility','go:Manage:Updates & schedules'),'Operator · Architect · Lead')+'</div>'+sharedList('Overview',5);}
function lifecycle(c){const item=Array.isArray(LIFECYCLES)?LIFECYCLES.find(x=>(x.id===c.id||String(x.component??x.name??'').toLowerCase().includes(c.name.toLowerCase()))):null;return (purposes[c.id]?'<div class="ac-banner">'+esc(purposes[c.id])+'</div>':'')+'<div class="ac-grid">'+card('Installation & ownership',row('State',pill(installed(c)?'Detected in scope':'Not installed on all targets'))+row('Binary owner',esc(c.owner))+row('Management',pill(managementLabel(c),managed(c)?'ac-ok':''))+row('Installed on disk',esc(updated(c)?c.candidate:installed(c)&&!c.installed?'Installed in demo; version check needed':c.version))+row('Runtime evidence',pill(updated(c)?'Restart / verification pending':'Not implied by installation','ac-warn'))+'<div class="ac-actions">'+btn(installed(c)?'Review management':'Choose install options','wizard')+btn('Lifecycle contract','lifecycle:'+c.id)+'</div>')+card('Upgrade eligibility',row('Available',pill(updated(c)?'Applied in demo':c.update?'Candidate available':'No independent update',c.held?'ac-warn':''))+row('Policy',esc(c.held?'Preserve private overlay':'Owning installer + compatibility checks'))+note(c.reason||'New v5 adapters require certification before real use.')+'<div class="ac-actions" style="margin-top:12px">'+btn('Check updates','check-updates')+btn('Preview upgrade','upgrade:'+c.id,false,!c.update||updated(c))+'</div>')+'</div>'}
const human={aqeProvider:'Default AQE provider',aqeFallback:'AQE provider fallback',models:'Ruflo provider models',maxBudgetUsd:'AQE budget (USD)',ttlHours:'Release metadata cache lifetime (hours)',preferredShellByEnvironment:'Preferred shell by environment',maxSummaries:'Retained scan summaries',maxAgeDays:'Maximum scan summary age (days)',typesafePicker:'Typesafe agent picker',minilmPicker:'MiniLM agent picker',learningProfile:'Learning profile',turnCredit:'Check bundled turn credit',memoryFix2887:'Check memory durability version',funnel:'Let Ruflo control promotions'};
function observedValue(s,m){return Object.hasOwn(state.values,m+'|'+s.id)?state.values[m+'|'+s.id]:s.default;}
function fieldValue(s){return Object.hasOwn(state.draft,s.id)?state.draft[s.id]:observedValue(s,targets()[0].id);}
function mixedValue(s){return new Set(targets().map(m=>JSON.stringify(observedValue(s,m.id)))).size>1;}
function fieldControl(s){if(s.component==='Scheduling')return btn('Open schedule policy','go:Manage:Updates & schedules')+note('One policy editor; saved state is shared.');if(s.component==='Onboarding')return btn('Open setup wizard','wizard');if(s.component==='Fleet')return btn('Inspect fleet policy','go:Manage:Machines');const v=fieldValue(s),id='field-'+s.id,read=['observational','unsupported'].includes(s.status)||s.advanced||s.scope==='invocation';if(s.key==='rufloComponents.mcpGovernance.maxCallsPerMinute'&&fieldValue(SETTINGS.find(x=>x.id==='ruflocomponents-mcpgovernance'))===false)return pill('Governance management released');if(read)return pill(s.status==='unsupported'?'Not implemented':s.advanced||s.scope==='invocation'?'Invocation option · inspect contract':typeof v==='object'?JSON.stringify(v):v??'Not set');if(s.type==='object-or-false')return '<select aria-label="'+esc(s.label)+'" data-setting="'+esc(s.id)+'" data-governance="true"><option value="managed" '+(v!==false?'selected':'')+'>Manage policy configuration</option><option value="unmanaged" '+(v===false?'selected':'')+'>Release management</option></select>';if(s.type==='boolean')return '<label class="ac-check"><input id="'+esc(id)+'" data-setting="'+esc(s.id)+'" type="checkbox" aria-label="'+esc(human[s.label]||s.label)+'" '+(v===true?'checked':'')+'> '+(v===true?'True':'False')+'</label>';if(s.options&&s.type!=='map')return '<select aria-label="'+esc(s.label)+'" data-setting="'+esc(s.id)+'"><option value="__unset__" '+(v==null?'selected':'')+'>Not set / inherit</option>'+s.options.map((o,i)=>o==='off'&&['codexcontext-mode','statusline-codex-preset'].includes(s.id)?'':'<option value="'+i+'" '+(JSON.stringify(v)===JSON.stringify(o)?'selected':'')+'>'+esc(o===false?'false · release management':o)+'</option>').join('')+'</select>';if(['object','array','record','map','object-or-false'].includes(s.type))return '<textarea aria-label="'+esc(s.label)+'" data-setting="'+esc(s.id)+'">'+esc(v==null?'null':JSON.stringify(v,null,2))+'</textarea>';return '<input aria-label="'+esc(s.label)+'" data-setting="'+esc(s.id)+'" type="'+(['integer','number'].includes(s.type)?'number':'text')+'" value="'+esc(v??'')+'" '+(s.min!==undefined?'min="'+s.min+'"':'')+' '+(s.max!==undefined?'max="'+s.max+'"':'')+' placeholder="'+esc(s.defaultState||'Not set / inherited')+'">';}

function configActions(){const n=Object.keys(state.draft).length;return '<div class="ac-banner"><div class="ac-actions"><strong>'+n+' draft change'+(n===1?'':'s')+'</strong><span>'+esc(scopeName())+'</span>'+btn('Review configuration plan','config-plan',true,!n)+btn('Discard draft','discard',false,!n)+'</div>'+parkedDrafts()+'</div>';}
function componentsView(){const c=component(state.component);return '<div class="ac-columns"><div class="ac-components">'+components.map(x=>'<button type="button" class="cursor-interaction" data-action="component:'+x.id+'" aria-pressed="'+(x.id===c.id)+'">'+esc(x.name)+'<small>'+esc(x.kind+' · '+(managed(x)?'managed':installed(x)?'observed':'not selected'))+'</small></button>').join('')+'</div><div><div class="ac-card-head"><h2>'+esc(c.name)+'</h2>'+pill(c.future?'Proposed v5 adapter':'Current component contract')+'</div>'+lifecycle(c)+'<section class="ac-card">'+groupedSettings(SETTINGS.filter(s=>!s.advanced&&classifySetting(s).components.includes(({ruflo:'Ruflo',aqe:'AQE',brain:'RuvNet Brain',agentdb:'AgentDB',browser:'agent-browser',security:'Security',claude:'Claude',codex:'Codex',opencode:'OpenCode',hermes:'Hermes',gemini:'Gemini CLI',grok:'Grok Build',ruvector:'RuVector',deja:'Deja Vu',kit:'Dashboard'})[c.id])))+'</section>'+configActions()+'</div></div>';}

function machineTable(){return '<div class="ac-table-wrap"><table><thead><tr><th>Machine</th><th>Connection</th><th>Work state</th><th>Management</th><th>Next action</th></tr></thead><tbody>'+targets().map(m=>'<tr><td>'+esc(m.name)+'<small>'+m.group+' · '+m.owner+'</small></td><td>'+pill(m.online?'Fresh · '+m.age:'Offline · '+m.age,m.online?'ac-ok':'ac-warn')+'</td><td>'+esc(m.busy?'Active session':'Idle')+'</td><td>Declared baseline<small>Local policy checked before a write</small></td><td>'+btn(m.online?'Inspect':'View stale evidence','machine:'+m.id)+'</td></tr>').join('')+'</tbody></table></div>'}
function driftView(){return '<div class="ac-actions">'+btn('Reassess scope','reassess')+btn('Preview all eligible fixes','repair-all',true)+'</div>'+attention(20)+'<div class="ac-banner">Focus changes relevance and order. Severity, evidence and eligibility remain the same. A configuration fix cannot resolve an upstream enforcement gap.</div>';}
function updateView(){return '<div class="ac-card">'+machineTable()+'</div><div class="ac-grid">'+card('Update when you choose','<div class="ac-actions">'+btn('Check for updates','check-updates')+btn('Preview selected updates','update-all',true)+'</div>'+components.filter(c=>c.update).map(c=>'<div class="ac-row"><div><h3>'+esc(c.name)+'</h3><p>'+esc(c.held?c.reason:c.owner)+'</p></div>'+btn(updated(c)?'Verified in demo':c.held?'Held':'Review','upgrade:'+c.id)+'</div>').join('')+note('Candidate versions are illustrative. Real eligibility is checked against owner, policy, dependencies and installed version.'))+card('Scheduled care','<label class="ac-check"><input type="checkbox" id="ac-schedule-enabled" '+(state.schedule.enabled?'checked':'')+'> Enable a maintenance schedule</label><div class="ac-banner">'+(state.schedule.saved?'Saved policy: '+(state.scheduleApplied?'Enabled · '+state.schedule.cadence+' '+state.schedule.time+' '+state.schedule.zone+' · '+state.schedule.mode:'Off'):'Saved policy: '+(state.scheduleApplied?'Enabled':'Off')+'. '+(state.schedule.enabled?'Unsaved draft enables scheduled care.':'Draft keeps scheduling off.'))+'</div><div class="ac-form"><label>Cadence<select id="ac-cadence" '+(!state.schedule.enabled?'disabled':'')+'>'+['Every Sunday','Every day','First day of month'].map(x=>'<option '+(x===state.schedule.cadence?'selected':'')+'>'+x+'</option>').join('')+'</select></label><div class="ac-form-row"><label>Time<input id="ac-time" type="time" value="'+state.schedule.time+'" '+(!state.schedule.enabled?'disabled':'')+'></label><label>Timezone<select id="ac-zone" '+(!state.schedule.enabled?'disabled':'')+'>'+['America/Los_Angeles','Europe/London','UTC'].map(x=>'<option '+(x===state.schedule.zone?'selected':'')+'>'+x+'</option>').join('')+'</select></label></div><label>Allowed action<select id="ac-schedule-mode" '+(!state.schedule.enabled?'disabled':'')+'>'+['Check and notify','Stage reviewed updates','Apply reviewed updates while idle'].map(x=>'<option '+(x===state.schedule.mode?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Components<select id="ac-schedule-components" '+(!state.schedule.enabled?'disabled':'')+'><option value="all" '+(state.schedule.components.length!==1||state.schedule.components[0]==='all-managed'?'selected':'')+'>All currently managed components</option>'+components.map(c=>'<option value="'+c.id+'" '+(state.schedule.components.length===1&&state.schedule.components[0]===c.id?'selected':'')+'>'+esc(c.name)+' only</option>').join('')+'</select></label>'+btn(state.schedule.enabled?'Review schedule':state.scheduleApplied?'Review disabling schedule':'Keep scheduling off','schedule-plan',state.schedule.enabled)+'</div>'+note('Uses the selected machine scope. Busy and offline machines defer; new permissions, data migrations or expanded targets require review.'))+'</div>';}
function manage(){let html=heading('Manage the whole setup.','Installation, configuration, upgrades and repair are visible together. Every change has an inspectable plan.',btn('Assess & adopt','wizard'));html+='<div class="ac-subnav">'+navTabs.Manage.map(t=>'<button type="button" class="cursor-interaction" data-action="tab:'+t+'" aria-pressed="'+(state.tab===t)+'">'+t+'</button>').join('')+'</div>';if(state.tab==='Components')return html+componentsView();if(state.tab==='Settings')return html+allSettings();if(state.tab==='Machines')return html+card('Enrolled machines',machineTable())+'<div class="ac-banner">Fleet enrollment and remote operations are proposed v5 capabilities. Current agentic-kit provides local export and aggregation.</div>';if(state.tab==='Drift')return html+driftView();if(state.tab==='Updates & schedules')return html+updateView();if(state.tab==='Routing & providers')return html+card('Activity routing',settingsRows('Routing'))+card('Provider and model bindings',settingsRows('Providers'))+configActions();if(state.tab==='Sharing')return html+card('Sharing and source boundaries',settingsRows('Fleet'))+card('Discovery and source selection',settingsRows('Discovery'))+configActions();return html+card('Maintenance workspace','<div class="ac-actions">'+btn('Inspect recoverable resources','maintenance-preview')+btn('View receipts','go:History')+'</div>'+note('Existing inventory, consumers, discovery, coverage, plans, recovery and undo remain separate shared capabilities.'))+sharedList('Manage',10);}

use','Kept separate from published model catalog')+row('Lifecycle notice',pill('Review replacement','ac-warn'))+row('Provider / payer','Unknown when source does not record it'),'Architect · Finance · Operator');else main+=card('Delivery and outcome evidence','<div class="ac-banner">Proposed source integration. Existing commits or session completion alone do not establish accepted delivery.</div>'+row('Review wait','42 minutes · sample')+row('Accepted outcomes','Link explicit work/PR/release evidence')+row('Cost per outcome','Only with aligned cost and outcome populations'),'Lead · Finance · Architect');return main+'<div class="ac-divider"></div>'+sharedList('Insights',12);}
function history(){return heading('Every change leaves evidence.','Operation state survives navigation. A host restart is recorded separately from dashboard availability.')+card('Operation history',state.receipts.length?state.receipts.map(r=>'<div class="ac-row"><div><h3>'+esc(r.title)+'</h3><p>'+esc(r.summary)+' · '+r.targets.join(', ')+'</p></div>'+btn('Receipt','receipt:'+r.id)+'</div>').join(''):'<div class="ac-banner">No demo changes yet. Inspect a drift item or run the onboarding assessment.</div>')+'<div class="ac-divider"></div>'+sharedList('History',8);}
function mapping(){const q=state.mapQuery.toLowerCase(),rows=PANELS.filter(p=>!q||(p.title+' '+p.area+' '+p.view+' '+p.id+' '+p.proposedHome).toLowerCase().includes(q));return heading('Every existing panel has a home.','One source identity and one canonical destination. Other views reuse the same panel; roles change attention, not the panel’s meaning.')+'<div class="ac-form-row"><label>Find a current panel<input id="ac-map-search" value="'+esc(state.mapQuery)+'" placeholder="About, context, models, maintenance…"></label><div class="ac-banner">'+PANELS.length+' mapped capability groups · '+new Set(PANELS.map(p=>p.id)).size+' unique source identities · '+rows.length+' shown</div></div><div class="ac-table-wrap"><table><thead><tr><th>Existing location / panel</th><th>Presentation retained</th><th>V5 home</th><th>Trace</th></tr></thead><tbody>'+rows.map(p=>'<tr><td>'+esc(p.title)+'<small>'+esc(p.area+' › '+p.view)+'<br>'+esc(p.id)+'</small></td><td>'+esc(p.presentation)+'</td><td>'+esc(p.proposedHome+(panelView(p)?' › '+panelView(p):''))+'<small>'+esc(panelReaders(p))+'</small></td><td>'+btn('Inspect','panel:'+p.id)+'</td></tr>').join('')+'</tbody></table></div>'+note('This is a source inventory and migration contract. The concept previews selected panels; it does not reimplement every existing interaction.');}

function panelDetail(id){const p=PANELS.find(p=>p.id===id)||PANELS.find(p=>p.area==='Observability');showInspector(p.title,'<div class="ac-banner">'+esc(p.area+' › '+p.view+' → '+p.proposedHome+(panelView(p)?' › '+panelView(p):''))+' · same canonical panel</div>'+row('Presentation',esc(p.presentation))+'<h3>Capabilities to preserve</h3><ul>'+p.capabilities.map(c=>'<li>'+esc(c)+'</li>').join('')+row('Common readers',esc(panelReaders(p)))+row('Canonical identity',esc(p.id)+' · shared, not duplicated')+'<p class="ac-small"><a href="'+source(p.source,p.line)+'">Inspect current implementation</a></p><div class="ac-actions" style="margin-top:14px">'+btn('Open destination','destination:'+p.proposedHome+':'+panelView(p))+'</div>');}
function inspectFinding(id){const f=findings.find(f=>f.id===id);showInspector(f.title,'<div class="ac-banner">'+esc(f.why[state.focus])+'</div>'+row('Observed',esc(f.before))+row('Severity',pill(f.severity,'ac-warn'))+row('Remedy',esc(f.remedy))+row('Verification',esc(f.after))+'<div class="ac-actions" style="margin-top:16px">'+btn(f.fixable?'Preview correction':'Inspect component','finding-plan:'+f.id,f.fixable)+btn('Open component settings','component:'+f.component)+'</div>'+note('Scenario is illustrative; source-grounded contracts distinguish configuration from runtime enforcement.'));}
function eligibleTargets(){return targets().map(m=>({id:m.id,name:m.name,status:!m.online?'Offline · deferred':m.busy?'Busy · wait until idle':'Eligible'}));}
function makePlan(kind,title,changes,extra={}){if(kind==='schedule')extra.initialSchedule=structuredClone(state.schedule);let relevant=null;if(kind==='repair')relevant=new Set(findings.filter(f=>(extra.findingIds||[]).includes(f.id)).flatMap(f=>f.machines));state.plan={id:'plan-'+Date.now(),kind,title,changes,scope:state.scope,targets:eligibleTargets().map(t=>relevant&&!relevant.has(t.id)?{...t,status:'Not affected'}:t),sourceRevision:1,project:'agentic-kit',...extra};renderPlan();}

function runPlan(){const p=state.plan;if(!p||p.blocked)return;if(state.job&&!state.job.done){$('#ac-live').textContent='An operation is already running. Its target set stays fixed.';return;}closeInspector();state.job={...p,step:0,done:false};render();const phases=['Preflight','Apply owned changes','Verify results','Write receipt'];function next(){const j=state.job;if(!j||j.id!==p.id)return;j.step++;if(j.step<4){renderJob();setTimeout(next,500);return;}j.done=true;const ids=p.targets.filter(t=>t.status==='Eligible').map(t=>t.id);if(p.kind==='repair')for(const id of p.findingIds||[])for(const m of ids)state.resolved[id+':'+m]=true;if(p.kind==='configuration'){for(const m of ids)for(const [k,v]of Object.entries(p.draft||{}))if(v===undefined)delete state.values[m+'|'+k];else state.values[m+'|'+k]=v;clearAppliedDraft(p);}if(p.kind==='update')for(const id of p.componentIds||[])for(const m of ids)state.updated[m+':'+id]=true;if(p.kind==='schedule')completeRememberedSchedule(p);if(p.kind==='onboarding'){for(const m of ids){for(const id of p.adopted||[]){state.ownership[m+':'+id]={managed:true,config:id==='ruvector'?false:!p.managementPolicy.touched&&state.ownership[m+':'+id]?state.ownership[m+':'+id].config:p.managementPolicy.config,upgrades:id==='ruvector'?false:!p.managementPolicy.touched&&state.ownership[m+':'+id]?state.ownership[m+':'+id].upgrades:p.managementPolicy.upgrades};state.installed[m+':'+id]=true;}for(const id of p.optedOut||[])state.ownership[m+':'+id]={managed:false,config:false,upgrades:false};}if(p.managementPolicy.config)for(const f of findings.filter(f=>f.fixable&&(p.adopted||[]).includes(f.component)))for(const m of ids)if(f.machines.includes(m))state.resolved[f.id+':'+m]=true;if(state.wizard)state.wizard.complete=true;}const held=p.targets.filter(t=>/Offline|Busy/.test(t.status)).length,excluded=p.targets.filter(t=>t.status==='Not affected').length;const receipt={id:p.id,title:p.title,summary:ids.length+' verified'+(held?'; '+held+' deferred':'')+(excluded?'; '+excluded+' not affected':'')+(p.kind==='update'?'; host restart tracked separately':''),targets:p.targets.map(t=>t.name),changes:p.changes,kind:p.kind};state.receipts.unshift(receipt);j.receipt=receipt;render();$('#ac-live').textContent=receipt.summary+'. Demo complete; the UI did not restart.';persist();}setTimeout(next,500);}
