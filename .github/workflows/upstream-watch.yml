name: upstream-watch

# The upstream watch (docs/upstream-watch.md, decision 15). The script decides
# everything: the window, the new records, the dispatch firings and the notice
# text. This workflow pushes the ledger commit the script built, posts the
# notice as a commit comment on it, and fails the run when a read or a
# dispatch failed. No model runs here.

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      record:
        description: Record, notify and dispatch (off = dry run in the job summary only)
        type: boolean
        default: true
      since:
        description: Start of the window (ISO date), for the first run or recovery
        type: string
        default: ''
  pull_request:
    paths:
      - scripts/upstream-watch.mjs
      - scripts/upstream-watch/**
      - src/lib/hook-audit/**
      - .github/workflows/upstream-watch.yml

permissions:
  contents: read

env:
  LEDGER_BRANCH: upstream-watch-ledger

jobs:
  # Read-only proof on a pull request that the workflow token reads the
  # upstream threads and the ledger branch. Never pushes, comments or fires.
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/upstream-watch.mjs record --dry-run --json > watch.json 2> errors.txt
          code=$?
          set -e
          {
            echo "## Upstream watch preview (exit $code)"
            jq -r 'if .blind then "blind \(.blind): \(.error // "unknown error"), could not check \(.fetchErrors | length), dispatch errors \(.dispatchErrors | length), deferred \(.deferred | length)" else "since \(.since) (\(.sinceSource)), new records \(.records | length), could not check \(.fetchErrors | length), dispatch errors \(.dispatchErrors | length), blind \(.blind), notice \(.notice.post), would fire \(.wouldFire | length), deferred \(.deferred | length)" end' watch.json
            jq -r '(.wouldFire // [])[] | "- would fire \(.id) \(.version) \(.branch)"' watch.json
            jq -r '(.deferred // [])[] | "- deferred \(.id) \(.version) \(.branch)"' watch.json
            jq -r '(.fired // [])[] | "- observed session before ledger failure: \(.id) \(.fields.session)"' watch.json
            echo; echo '```text'; cat errors.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  watch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: upstream-watch
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RECORD: ${{ github.event_name == 'schedule' || inputs.record }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Record
        env:
          SINCE: ${{ inputs.since }}
          UPSTREAM_DISPATCH_ROUTINE: trig_01LmNVKJ4K86joHPvvPtc7yx
          UPSTREAM_DISPATCH_TOKEN: ${{ secrets.UPSTREAM_DISPATCH_TOKEN }}
        run: |
          args=(record --json)
          [ "$RECORD" = true ] || args+=(--dry-run)
          [ -z "$SINCE" ] || args+=(--since "$SINCE")
          set +e
          node scripts/upstream-watch.mjs "${args[@]}" > watch.json 2> errors.txt
          code=$?
          set -e
          {
            echo "## Upstream watch (exit $code)"
            jq -r 'if .blind then "blind \(.blind): \(.error // "unknown error"), could not check \(.fetchErrors | length), dispatch errors \(.dispatchErrors | length), deferred \(.deferred | length)" else "since \(.since) (\(.sinceSource)), new records \(.records | length), could not check \(.fetchErrors | length), dispatch errors \(.dispatchErrors | length), blind \(.blind), commit \(.commit // "none"), would fire \(.wouldFire | length), deferred \(.deferred | length)" end' watch.json
            jq -r '(.wouldFire // [])[] | "- would fire \(.id) \(.version) \(.branch)"' watch.json
            jq -r '(.deferred // [])[] | "- deferred \(.id) \(.version) \(.branch)"' watch.json
            jq -r '(.fired // [])[] | "- observed session before ledger failure: \(.id) \(.fields.session)"' watch.json
            echo; echo '```text'; cat errors.txt; echo '```'
            jq -r '.notice.body' watch.json
          } >> "$GITHUB_STEP_SUMMARY"
          # 3 = blind: gh unusable, the registry invalid, the ledger unreadable, no upstream thread read,
          # or a ledger commit that could not be built.
          exit "$code"
      - name: Push the ledger commit
        if: env.RECORD == 'true'
        run: |
          commit=$(jq -r '.commit // empty' watch.json)
          [ -n "$commit" ] || { echo 'No new records.'; exit 0; }
          git push origin "$commit:refs/heads/$LEDGER_BRANCH"
      - name: Notify
        if: env.RECORD == 'true'
        run: |
          [ "$(jq -r '.notice.post' watch.json)" = true ] || { echo 'Nothing needs the maintainer.'; exit 0; }
          commit=$(jq -r '.commit // empty' watch.json)
          [ -n "$commit" ] || { echo 'Notice requested without a ledger commit.' >&2; exit 1; }
          jq -r '.notice.body' watch.json > notice.md
          test -s notice.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$commit/comments" -F body=@notice.md --jq .html_url
      - name: Verdict
        run: |
          jq -r '.fetchErrors[] | "Could not check \(.id): \(.error)"' watch.json
          jq -r '.dispatchErrors[] | "Dispatch \(.id): \(.error)"' watch.json
          [ "$(jq '(.fetchErrors | length) + (.dispatchErrors | length)' watch.json)" -eq 0 ]
