name: ci

on:
  push:
    branches: [main, develop, npm-kit]
  pull_request:
  workflow_dispatch:

jobs:
  minimum-runtime:
    name: minimum runtime (Node 22.13.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - run: node bin/agentic-kit.mjs --help --all
      - run: node --test tests/kit/node-runtime.test.mjs tests/kit/sqlite.test.mjs tests/kit/usage-audit-211.test.mjs

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Zero runtime dependencies — no install step by design.
      - name: Unit + statusline tests
        env:
          # Every leg runs the full suite; Ubuntu/Node 24 owns the coverage gate.
          AK_TEST_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 && '1' || '0' }}
        run: pnpm test

      # Explicit guard: every dispatchable command must ship a --help/Examples
      # surface. Fails the build if a new command lands without one.
      - name: Dispatch surface (help/Examples for every command)
        run: pnpm run test:surface

      - name: CLI smoke (sandboxed HOME)
        shell: bash
        env:
          # Isolate every home-relative write (kit.json, CLAUDE.md, settings).
          HOME: ${{ runner.temp }}/kit-home
          USERPROFILE: ${{ runner.temp }}\kit-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/kit-home/.config
          APPDATA: ${{ runner.temp }}\kit-home\AppData\Roaming
        run: |
          mkdir -p "$HOME"
          # The smoke test proves local CLI behavior, not npm reachability.
          # Seed a fresh empty drift cache so an offline Windows runner does
          # not pay four sequential 20s `npm view` timeouts inside status.
          node -e 'const fs=require("node:fs"),p=require("node:path"),base=process.platform==="win32"?process.env.APPDATA:process.env.XDG_CONFIG_HOME,dir=p.join(base,"agentic-kit"),last=Date.now();fs.mkdirSync(dir,{recursive:true});fs.writeFileSync(p.join(dir,"kit.json"),JSON.stringify({versionCheck:{last,seen:{},self:{last,best:null,lastTags:["latest","next"]}}}))'
          node bin/agentic-kit.mjs --version
          node bin/agentic-kit.mjs --help --all > /dev/null
          # status must emit valid JSON and exit deterministically even on a
          # machine with no ruflo installed (rows degrade to warn/fail).
          node bin/agentic-kit.mjs status --json > status.json || true
          node -e "const s=require('./status.json'); if(!Array.isArray(s.rows)||!s.overall) throw new Error('bad status JSON'); console.log('status rows:', s.rows.length, 'overall:', s.overall)"
          # managed-block engine round-trip against the sandbox HOME
          node bin/agentic-kit.mjs x reference sync
          node -e "const fs=require('fs'),os=require('os'),p=require('path').join(os.homedir(),'.claude','CLAUDE.md'); const t=fs.readFileSync(p,'utf8'); for (const s of ['ruflo-preamble','ruflo-reference']) if(!t.includes('<!-- BEGIN '+s+' -->')) throw new Error('missing block '+s); console.log('blocks OK')"
          node bin/agentic-kit.mjs uninstall --dry-run

  # Static quality gates. Platform-independent → single OS. This is the only job
  # that installs devDependencies (the published package stays zero-runtime-dep).
  quality:
    name: quality (typecheck, lint, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install devDependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --checkJs)
        run: pnpm run typecheck
      - name: Lint (eslint)
        run: pnpm run lint
      # Hard complexity ceiling earned by the 2026-08 complexity program
      # (ADR-0037): no function over CC 50, enforced as an error. The
      # advisory warn-25 tier lives in eslint.config.mjs.
      - name: Complexity ceiling (CC ≤ 50, error)
        run: pnpm run lint:cc
      - name: Markdown lint
        run: pnpm run lint:md
      - name: Build (packaging + load validation)
        run: pnpm run build
      - name: Dependency audit
        run: pnpm run audit

  # Rendering verification: the route suites prove the server returns correct
  # JSON; only this proves the page RENDERS it (no `undefined`/`NaN`/
  # `[object Object]` in visible text). Drives the SYSTEM Chrome — ubuntu
  # runners ship it, nothing is downloaded.
  ui:
    name: ui (dashboard rendering, system Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install devDependencies
        run: pnpm install --frozen-lockfile
      - name: Dashboard UI (Playwright, fixture corpus)
        run: pnpm run test:ui

  # Internal/relative links only (fast, deterministic). External links run in
  # nightly — network + rate-limits make them flaky per-PR.
  links:
    name: links (internal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --include-fragments --config lychee.toml README.md CLAUDE.md AGENTS.md 'docker/*.md' 'claude/**/*.md' 'src/templates/**/*.md' 'docs/**/*.md' 'docs/**/*.html'"
          fail: true

  # Temporary C1 proof: remove this job before merging the feature PR.
  c1-native-proof:
    name: C1 native proof (${{ matrix.os }}, AQE ${{ matrix.aqe }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, aqe: '3.14.4', memory: true }
          - { os: windows-latest, aqe: '3.14.4', memory: true }
          - { os: ubuntu-latest, aqe: '3.14.5', memory: false }
          - { os: macos-latest, aqe: '3.14.5', memory: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Configure isolated npm prefix
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'c1-installer-home'
          $prefix = Join-Path $root 'npm-prefix'
          foreach ($dir in @($root, $prefix, (Join-Path $root 'npm-cache'))) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          foreach ($key in @('HOME','USERPROFILE','XDG_CONFIG_HOME','XDG_STATE_HOME','XDG_DATA_HOME','XDG_CACHE_HOME','APPDATA','LOCALAPPDATA','CODEX_HOME','CLAUDE_CONFIG_DIR','HERMES_HOME','MISE_DATA_DIR','MISE_CONFIG_DIR','MISE_CACHE_DIR')) {
            $value = Join-Path $root $key.ToLowerInvariant()
            New-Item -ItemType Directory -Force -Path $value | Out-Null
            "$key=$value" >> $env:GITHUB_ENV
          }
          "npm_config_prefix=$prefix" >> $env:GITHUB_ENV
          "npm_config_cache=$(Join-Path $root 'npm-cache')" >> $env:GITHUB_ENV
          if ($IsWindows) {
            "AK_AQE_PACKAGE_ROOT=$(Join-Path $prefix 'node_modules/agentic-qe')" >> $env:GITHUB_ENV
            $prefix >> $env:GITHUB_PATH
          } else {
            "AK_AQE_PACKAGE_ROOT=$(Join-Path $prefix 'lib/node_modules/agentic-qe')" >> $env:GITHUB_ENV
            (Join-Path $prefix 'bin') >> $env:GITHUB_PATH
          }
      - name: Install exact upstream artifacts with native scripts
        shell: pwsh
        run: |
          npm install -g --allow-scripts=ruflo,agentic-qe,@claude-flow/cli,better-sqlite3,hnswlib-node,agentdb,agentic-flow,argon2,onnxruntime-node,sharp,protobufjs,@google/genai,tldjs,vibium ruflo@3.48.0 agentic-qe@${{ matrix.aqe }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "const p=require(process.env.AK_AQE_PACKAGE_ROOT+'/package.json');if(p.version!=='${{ matrix.aqe }}')process.exit(1);console.log(p.name,p.version)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ruflo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Source and package receipt
        shell: pwsh
        run: |
          git rev-parse HEAD | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'c1-head.txt')
          node -e "const fs=require('fs'),c=require('crypto'),p=require('path'),r=process.env.AK_AQE_PACKAGE_ROOT;for(const f of ['package.json','dist/cli/bundle.js','dist/integrations/ruvector/shared-rvf-adapter.js'])console.log(f,c.createHash('sha256').update(fs.readFileSync(p.join(r,f))).digest('hex'))" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'c1-source-hashes.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native AQE live-lock conformance (POSIX)
        if: matrix.os != 'windows-latest'
        shell: pwsh
        env:
          AK_AQE_LOCK_LIVE: '1'
          AK_AQE_EXPECTED_VERSION: ${{ matrix.aqe }}
        run: |
          node scripts/run-tests.mjs exec -- --test tests/live/aqe-live-lock-conformance.test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'c1-aqe-live-lock.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'c1-aqe-live-lock.log')
          if ($text -notmatch '"liveLock":true' -or $text -notmatch '"lockHeld":true') { throw 'AQE proof lacked the native contention JSON receipt' }
      - name: Diagnose Windows Ruflo transport
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AK_RUFLO_WINDOWS_DIAGNOSTIC: '1'
        run: |
          $env:AK_RUFLO_PACKAGE_ROOT = Join-Path $env:npm_config_prefix 'node_modules/ruflo'
          node scripts/run-tests.mjs focus tests/live/ruflo-windows-transport.test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'c1-windows-transport.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real Ruflo memory routing (Linux and Windows)
        if: matrix.memory
        shell: pwsh
        run: |
          ruflo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-tests.mjs exec -- --test tests/live/ruflo-memory-routing.test.mjs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'c1-memory-routing.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'c1-memory-routing.log')
          if ($text -notmatch '"status":"observed"') { throw 'Ruflo routing proof lacked an observed JSON receipt' }
      - name: Upload C1 source-bound proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: c1-native-proof-${{ matrix.os }}-aqe-${{ matrix.aqe }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c1-*.log
            ${{ runner.temp }}/c1-head.txt
            ${{ runner.temp }}/c1-source-hashes.txt
          if-no-files-found: error
