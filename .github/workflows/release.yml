name: release

# Publishes to npm when a version tag is pushed (v4.0.0, v4.0.0-beta.1, v4.1.0-alpha.1, …),
# then creates the matching GitHub Release with auto-generated notes. The dist-tag comes from
# scripts/release-dist-tag.mjs: betas -> beta, other prereleases -> next, releases -> latest.
# A manual run (workflow_dispatch) is a dry run only: it runs the tests and `publish --dry-run`
# for the checked-out version, and never publishes or creates a GitHub Release.
# Uses the NPM_TOKEN repository secret via NODE_AUTH_TOKEN. Configure a valid
# granular package-publish token with appropriate 2FA capability and expiry;
# secret validity is a release-owner check, not a property of this workflow.
# The tag must match package.json's version — the guard below enforces it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # version comes from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test gate
        run: pnpm test

      - name: Tag ↔ package.json version guard
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$REF_NAME" ]; then
            echo "tag $REF_NAME does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to npm registry (with provenance)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIST_TAG=$(node scripts/release-dist-tag.mjs "$VERSION")
          echo "publishing $VERSION on dist-tag '$DIST_TAG'"
          if [ "${{ github.event_name }}" = "push" ]; then
            pnpm publish --provenance --access public --tag "$DIST_TAG" --no-git-checks
          else
            # manual run: nothing is published (no provenance, no registry write)
            pnpm publish --dry-run --access public --tag "$DIST_TAG" --no-git-checks
          fi

  # Runs only after a successful npm publish, so a Release object never exists
  # for a version that didn't actually ship.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release (auto-generated notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mirror the npm dist-tag split: prereleases get the badge and are
          # excluded from releases/latest; stable versions become Latest
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease ;;
            *)   gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest ;;
          esac
