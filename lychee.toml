# Link checker config (internal + external). Scope is set by the invoking glob
# in CI/scripts (our authored docs), and vendored trees are excluded below so we
# never validate ruflo/aqe's links.
#
# On PRs we check INTERNAL/relative links only (fast, deterministic); external
# links run in nightly (network + rate-limits make them flaky per-PR).

# Treat these as success (GitHub/CI sometimes rate-limits or 403s bots).
accept = [200, 206, 429]

max_retries = 2
retry_wait_time = 2
timeout = 20
max_concurrency = 8

# Don't descend into vendored trees.
exclude_path = [
  "node_modules",
  ".claude",
  ".agentic-qe",
  ".agents",
]

# Hosts that reliably 403/rate-limit automated requests — noise, not broken links.
exclude = [
  "^https://img\\.shields\\.io",
  "^https://www\\.npmjs\\.com",  # npm package pages 403 bots/CI
  "^https://doi\\.org",  # Crossref DOI proxy 403s bot UAs; resolves fine for browsers
  "^https://openai\\.com",  # OpenAI marketing/brand pages 403 bot UAs (Cloudflare); resolves fine for browsers
  "^https://www\\.investing\\.com",  # news site 403s bot UAs; cited in a dated audit
  # Frozen evidence in docs/archive cites targets that are private, removed or expire; the
  # archived text is a dated record and is not rewritten.
  "^https://github\\.com/pacphi/retort/blob/main/versions-blog\\.md$",  # file no longer on main
  "^https://github\\.com/pacphi/ruflo-machine-ref/issues/8$",  # private or removed repo
  "^https://alphasignal\\.ai/news/openai-s-gpt-6-1-sol-",  # article removed
  "^https://github\\.com/pacphi/agentic-kit/actions/runs/[0-9]+/artifacts/",  # CI artifacts expire
]
